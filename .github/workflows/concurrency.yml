name: Concurrency Demo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: concurrency-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Show environment
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Concurrency group: concurrency-${{ inputs.environment }}"

      - name: Run test
        run: |
          echo "Test started"
          sleep 60
          echo "Test finished"
